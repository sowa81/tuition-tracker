<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sowa's Tuition Tracker</title>

<style>
:root{--bg:#fbf6f7;--card:#fff;--ink:#3d2630;--muted:#866d76;--accent:#7b3048;--soft:#f2e3e8;--line:#ead7dd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:28px 18px 20px;text-align:center;background:linear-gradient(135deg,#f7e5eb,#fff8fa)}
h1{margin:0;font-size:27px}
.sub{color:var(--muted);margin:7px 0 0;font-size:14px}
.wrap{max-width:1050px;margin:auto;padding:18px}
.grid{display:grid;grid-template-columns:330px 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 5px 20px #5b263010}
h2{font-size:18px;margin:0 0 13px}
label{font-size:13px;color:var(--muted);display:block;margin:10px 0 5px}
input,select,button{font:inherit}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink)}
button{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;background:var(--accent);color:white;font-weight:650}
.ghost{background:var(--soft);color:var(--accent)}
.danger{background:#eee;color:#8b3340}
.actions{display:flex;gap:8px;margin-top:14px}
.actions button{flex:1}
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month{font-weight:750;font-size:18px}
.nav{display:flex;gap:6px}
.nav button{padding:7px 11px}
.week,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.week div{text-align:center;color:var(--muted);font-size:12px;font-weight:700;padding:4px}
.day{min-height:78px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:7px;cursor:pointer;position:relative}
.day:hover{background:#fff8fa}
.day.blank{background:transparent;border:0;cursor:default}
.num{font-size:12px;font-weight:700}
.marks{margin-top:7px;display:flex;flex-wrap:wrap;gap:3px}
.dot{font-size:10px;background:var(--soft);color:var(--accent);padding:2px 4px;border-radius:5px;max-width:100%;overflow:hidden;white-space:nowrap}
.list{margin-top:16px}
.tuition{border:1px solid var(--line);border-radius:13px;padding:12px;margin:8px 0;background:#fff}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.name{font-weight:750}
.count{color:var(--accent);font-weight:800}
.bar{height:7px;background:#f0e4e8;border-radius:10px;margin:9px 0}
.fill{height:100%;background:var(--accent);border-radius:10px}
.small{font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:18px 5px}
.modal{position:fixed;inset:0;background:#24151b80;display:none;align-items:center;justify-content:center;padding:18px;z-index:1000}
.modal.on{display:flex}
.modalbox{background:white;border-radius:18px;padding:20px;max-width:400px;width:100%;max-height:90vh;overflow:auto}
.schedule-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:15px 0}
.schedule-day{margin:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
.schedule-day input{width:auto;margin-right:6px}
.today-title{font-size:18px;text-align:center;padding:12px;font-weight:700}
.cycle-note{font-size:12px;color:var(--muted);margin-top:7px;opacity:.75}
@media(max-width:760px){
  .grid{grid-template-columns:1fr}
  .day{min-height:62px}
  .dot{font-size:9px}
}
</style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7b3048">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tuition Tracker">
<link rel="apple-touch-icon" href="icon.svg">
</head>

<body>

<header>
<h1>🌷 Sowa's Tuition Tracker</h1>
<div class="sub">Track every tuition separately • 12 teaching days per cycle</div>
</header>

<div class="wrap">
<div class="grid">

<section class="card">

<h2>Add / Manage Tuition</h2>

<label>Student / Tuition Name</label>
<input id="name" placeholder="e.g. Rafi">

<label>Target Teaching Days</label>
<input id="target" type="number" min="1" value="12">

<div class="actions">
<button onclick="addTuition()">Add Tuition</button>
<button class="ghost" onclick="exportData()">Backup</button>
<button class="ghost" onclick="importData()">Restore</button>
</div>

<div class="list">
<h2 style="margin-top:20px">Your Tuitions</h2>
<div id="list"></div>
</div>

</section>

<section class="card">

<div class="calendar-head">
<div class="month" id="month"></div>

<div class="nav">
<button class="ghost" onclick="moveMonth(-1)">‹</button>
<button class="ghost" onclick="goToday()">Today</button>
<button class="ghost" onclick="moveMonth(1)">›</button>
</div>
</div>

<div class="week">
<div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div>
<div>Thu</div><div>Fri</div><div>Sat</div>
</div>

<div class="cal" id="cal"></div>

<div class="small" style="margin-top:12px">
Click a date → choose the tuition → mark it taught.
Scheduled classes appear faded until they are taught.
</div>

</section>

</div>
</div>


<!-- MARK TAUGHT -->

<div class="modal" id="modal">
<div class="modalbox">

<h2 id="modalTitle">Teaching Day</h2>

<label>Choose Tuition</label>
<select id="sel"></select>

<div class="actions">
<button onclick="saveDay()">Mark Taught</button>
<button class="ghost" onclick="closeModal()">Cancel</button>
</div>

</div>
</div>


<!-- WEEKLY SCHEDULE -->

<div class="modal" id="scheduleModal">
<div class="modalbox">

<h2 id="scheduleTitle">Set This Week</h2>

<div class="schedule-grid" id="scheduleDays"></div>

<div class="actions">
<button onclick="saveSchedule()">Save</button>
<button class="ghost" onclick="closeSchedule()">Cancel</button>
</div>

</div>
</div>


<!-- TODAY POPUP -->

<div class="modal" id="todayPopup">
<div class="modalbox">

<div id="todayTuitionList"></div>

<div class="actions">
<button onclick="closeTodayPopup()">Okay</button>
</div>

</div>
</div>


<script>

let data={
  tuitions:[]
};

let view=new Date();
view.setDate(1);

let picked=null;
let scheduleTuitionId=null;

const DB_NAME="SowaTuitionDB";
const DB_VERSION=1;
const STORE="app";

let dbReady=null;


function openDB(){

return dbReady ||= new Promise((resolve,reject)=>{

const req=indexedDB.open(DB_NAME,DB_VERSION);

req.onupgradeneeded=()=>{
if(!req.result.objectStoreNames.contains(STORE)){
req.result.createObjectStore(STORE);
}
};

req.onsuccess=()=>resolve(req.result);
req.onerror=()=>reject(req.error);

});

}


async function loadData(){

try{

const db=await openDB();

const d=await new Promise((resolve,reject)=>{

const r=db.transaction(STORE,"readonly")
.objectStore(STORE)
.get("data");

r.onsuccess=()=>resolve(r.result);
r.onerror=()=>reject(r.error);

});

if(d){

data=d;

if(!Array.isArray(data.tuitions)){
data.tuitions=[];
}

localStorage.setItem(
"sowaTuitions",
JSON.stringify(data)
);

return;

}

}catch(e){}


try{

data=JSON.parse(
localStorage.getItem("sowaTuitions")
||'{"tuitions":[]}'
);

if(!Array.isArray(data.tuitions)){
data.tuitions=[];
}

}catch(e){

data={tuitions:[]};

}

}


async function save(){

localStorage.setItem(
"sowaTuitions",
JSON.stringify(data)
);

try{

const db=await openDB();

await new Promise((resolve,reject)=>{

const r=db.transaction(STORE,"readwrite")
.objectStore(STORE)
.put(data,"data");

r.onsuccess=resolve;
r.onerror=()=>reject(r.error);

});

}catch(e){}

}


async function addTuition(){

let n=document.getElementById("name").value.trim();

let t=Math.max(
1,
+document.getElementById("target").value||12
);

if(!n){
return alert("Enter a tuition name.");
}

if(
data.tuitions.some(
x=>x.name.toLowerCase()===n.toLowerCase()
)
){

return alert(
"This name already exists. Use the existing entry."
);

}


data.tuitions.push({

id:Date.now()+Math.random(),

name:n,

target:t,

days:[],

schedule:{},

cycleStart:null

});


await save();

document.getElementById("name").value="";

render();

}


function key(d){

return d.toISOString().slice(0,10);

}


/* WEEK FUNCTIONS */

function getWeekDates(){

const now=new Date();

const start=new Date(now);

start.setHours(0,0,0,0);

start.setDate(
now.getDate()-now.getDay()
);

let result=[];

for(let i=0;i<7;i++){

const d=new Date(start);

d.setDate(
start.getDate()+i
);

result.push(key(d));

}

return result;

}


function getWeekId(date){

const d=new Date(date);

d.setHours(0,0,0,0);

d.setDate(
d.getDate()-d.getDay()
);

return key(d);

}


/* CYCLE LOGIC */

function getCycleInfo(x){

  let days=[...(x.days||[])].sort();

  let target=Math.max(
    1,
    Number(x.target)||12
  );

  let completedCycles=
    Math.floor((days.length-1)/target);

  let cycleStartIndex=
    completedCycles*target;

  let currentCount=
    days.length-cycleStartIndex;

  let cycleNumber=
    completedCycles+1;

  let cycleComplete=
    currentCount===target;

  return{
    count:currentCount,
    target:target,
    cycleNumber:cycleNumber,
    completedCycles:completedCycles,
    cycleComplete:cycleComplete
  };

  }


function render(){

renderList();
renderCal();

}


function renderList(){

let el=document.getElementById("list");

if(!data.tuitions.length){

el.innerHTML=
'<div class="empty">No tuitions added yet.</div>';

return;

}


el.innerHTML=data.tuitions.map(x=>{

/*
Migrate old data safely.
*/

if(!Array.isArray(x.days)){
x.days=[];
}

if(!x.schedule){
x.schedule={};
}

const cycle=getCycleInfo(x);

const currentSchedule=
Array.isArray(
x.schedule[getWeekId(new Date())]
)
?x.schedule[getWeekId(new Date())]
:[];


const dayNames=[
"Sun","Mon","Tue","Wed","Thu","Fri","Sat"
];


const weekText=currentSchedule.length
?currentSchedule.map(d=>{

const day=
new Date(d+"T00:00:00");

return dayNames[day.getDay()];

}).join(", ")
:"No classes set";


const pct=
Math.min(
100,
cycle.count/cycle.target*100
);


return `

<div class="tuition">

<div class="row">

<span class="name">
${esc(x.name)}
</span>

<span class="count">
${cycle.count}/${cycle.target}
</span>

</div>


<div class="bar">

<div
class="fill"
style="width:${pct}%">
</div>

</div>


<div class="row">

<span class="small">
${cycle.count} days in current cycle
</span>

<span class="small">
${Math.max(0,cycle.target-cycle.count)} more needed
</span>

</div>


<div
class="cycle-note">

Cycle ${cycle.cycleNumber} •
This week: ${weekText}

</div>


<div class="actions">

<button
class="ghost"
onclick="openSchedule('${x.id}')">

Set days

</button>

<button
class="ghost"
onclick="changeTarget('${x.id}')">

Target

</button>

<button
class="danger"
onclick="removeTuition('${x.id}')">

Delete

</button>

</div>

</div>

`;

}).join("");

}


function renderCal(){

let y=view.getFullYear();

let m=view.getMonth();

let first=new Date(y,m,1);

let last=new Date(y,m+1,0);


document.getElementById("month")
.textContent=
first.toLocaleString(
"en",
{
month:"long",
year:"numeric"
}
);


let out="";


for(
let i=0;
i<first.getDay();
i++
){

out+='<div class="day blank"></div>';

}


for(
let d=1;
d<=last.getDate();
d++
){

let dt=new Date(y,m,d);

let k=key(dt);

let today=
k===key(new Date());


let marks=
data.tuitions.map(x=>{

let taught=
(x.days||[]).includes(k);


let weekId=
getWeekId(dt);


let scheduled=
x.schedule &&
Array.isArray(
x.schedule[weekId]
) &&
x.schedule[weekId].includes(k);


if(taught){

return `
<span class="dot">
✓ ${esc(x.name)}
</span>
`;

}


if(scheduled){

return `
<span
class="dot"
style="opacity:.45">

${esc(x.name)}

</span>
`;

}


return "";

}).join("");


out+=`

<div
class="day"
style="${
today
?"outline:2px solid var(--accent)"
:""
}"
onclick="openModal('${k}')">

<div class="num">
${d}
</div>

<div class="marks">
${marks}
</div>

</div>

`;

}


document.getElementById("cal")
.innerHTML=out;

}


/* TEACHING DAY */

function openModal(k){

if(!data.tuitions.length){

return alert(
"Add a tuition first."
);

}

picked=k;


document.getElementById(
"modalTitle"
).textContent=
"Teaching Day • "+
new Date(
k+"T00:00:00"
).toLocaleDateString();


document.getElementById(
"sel"
).innerHTML=
data.tuitions.map(x=>
`<option value="${x.id}">
${esc(x.name)}
</option>`
).join("");


document.getElementById(
"modal"
).classList.add("on");

}


function closeModal(){

document.getElementById(
"modal"
).classList.remove("on");

}


async function saveDay(){

let x=data.tuitions.find(
x=>
String(x.id)===
document.getElementById("sel").value
);

if(!x)return;


if(!Array.isArray(x.days)){
x.days=[];
}


if(x.days.includes(picked)){

x.days=
x.days.filter(
d=>d!==picked
);

}else{

x.days.push(picked);

}


await save();

closeModal();

render();

}


/* WEEKLY SCHEDULE */

function openSchedule(id){

scheduleTuitionId=id;


const tuition=
data.tuitions.find(
x=>
String(x.id)===
String(id)
);


if(!tuition)return;


document.getElementById(
"scheduleTitle"
).textContent=
tuition.name+
" — This Week";


const dates=getWeekDates();


const names=[
"Sun","Mon","Tue","Wed","Thu","Fri","Sat"
];


if(!tuition.schedule){
tuition.schedule={};
}


const weekId=
getWeekId(new Date());


const selected=
Array.isArray(
tuition.schedule[weekId]
)
?tuition.schedule[weekId]
:[];


document.getElementById(
"scheduleDays"
).innerHTML=

dates.map(
(date,i)=>`

<label class="schedule-day">

<input
type="checkbox"
class="scheduleCheck"
value="${date}"
${
selected.includes(date)
?"checked"
:""
}>

${names[i]}

</label>

`
).join("");


document.getElementById(
"scheduleModal"
).classList.add("on");

}


function closeSchedule(){

document.getElementById(
"scheduleModal"
).classList.remove("on");

scheduleTuitionId=null;

}


async function saveSchedule(){

const tuition=
data.tuitions.find(
x=>
String(x.id)===
String(scheduleTuitionId)
);

if(!tuition)return;


if(!tuition.schedule){
tuition.schedule={};
}


const weekId=
getWeekId(new Date());


const selected=[
...document.querySelectorAll(
".scheduleCheck:checked"
)
].map(
x=>x.value
);


tuition.schedule[weekId]=selected;


await save();

closeSchedule();

render();

}


/* TODAY POPUP */

function showTodayPopup(){

if(
!data ||
!Array.isArray(data.tuitions)
)return;


const today=
key(new Date());


const weekId=
getWeekId(new Date());


const names=
data.tuitions
.filter(x=>
x.schedule &&
Array.isArray(
x.schedule[weekId]
) &&
x.schedule[weekId].includes(today)
)
.map(
x=>esc(x.name)
);


if(!names.length)return;


document.getElementById(
"todayTuitionList"
).innerHTML=

`<div class="today-title">

🌷 Today's Tuition :
${names.map(
n=>`${n}📚`
).join(", ")}

</div>`;


document.getElementById(
"todayPopup"
).classList.add("on");

}


function closeTodayPopup(){

document.getElementById(
"todayPopup"
).classList.remove("on");

}


/* MONTH NAVIGATION */

function moveMonth(n){

view.setMonth(
view.getMonth()+n
);

render();

}


function goToday(){

view=new Date();

view.setDate(1);

render();

}


/* DELETE */

async function removeTuition(id){

if(
confirm(
"Delete this tuition and all its saved dates?"
)
){

data.tuitions=
data.tuitions.filter(
x=>
String(x.id)!==
String(id)
);

await save();

render();

}

}


/* TARGET */

async function changeTarget(id){

let x=
data.tuitions.find(
x=>
String(x.id)===
String(id)
);


let v=
prompt(
"Target teaching days per cycle:",
x.target
);


if(
v!==null &&
+v>0
){

x.target=+v;

await save();

render();

}

}


/* BACKUP */

function exportData(){

let b=new Blob(
[
JSON.stringify(
data,
null,
2
)
],
{
type:"application/json"
}
);


let a=
document.createElement("a");


a.href=
URL.createObjectURL(b);


a.download=
"sowa-tuition-backup.json";


a.click();


setTimeout(
()=>{
URL.revokeObjectURL(
a.href
);
},
1000
);

}


/* RESTORE */

function importData(){

const i=
document.createElement("input");

i.type="file";

i.accept=
".json,application/json";


i.onchange=async()=>{

const f=i.files[0];

if(!f)return;


try{

const d=
JSON.parse(
await f.text()
);


if(
!d ||
!Array.isArray(
d.tuitions
)
){

throw 0;

}


/*
Make sure restored old data
also works with the new system.
*/

d.tuitions=d.tuitions.map(x=>({

...x,

days:Array.isArray(x.days)
?x.days
:[],

schedule:
x.schedule &&
typeof x.schedule==="object" &&
!Array.isArray(x.schedule)
?x.schedule
:{}

}));


data=d;


await save();

render();


alert(
"Your tuition data has been restored."
);


}catch(e){

alert(
"That backup file is not valid."
);

}

};


i.click();

}


/* ESCAPE HTML */

function esc(s){

return String(s).replace(
/[&<>"']/g,
c=>
({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c])
);

}


/* START */

loadData().then(()=>{

render();

setTimeout(
showTodayPopup,
500
);

});

</script>


<script>

if(
"serviceWorker" in navigator
){

window.addEventListener(
"load",
()=>{
navigator.serviceWorker.register(
"./sw.js"
);
}
);

}

</script>

</body>
  </html>
